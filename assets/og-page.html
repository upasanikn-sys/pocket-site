<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket — page card source</title>
<!--
  SOURCE FILE for assets/og/<page>.png (1200x630, each page's own link-preview card, SITE_TO_9 A14).
  A rendering target, not a page: tools/site_og.py opens it with the page's title, description and, where
  the page has one, a real capture in the address's #fragment, and saves what it draws. Regenerate with

    python tools/site_og.py

  Direction C: film ground, ink type, the Pocket logo as supplied, a phone capture on a plain card. No glow,
  grid, grain or shadow beyond --lift, and nothing from a third party.
-->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="vestora-tokens.css?v=4">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
  .card{height:100%;display:grid;grid-template-columns:minmax(0,1fr);padding:56px 72px}
  .card.pic{grid-template-columns:minmax(0,1fr) 340px;column-gap:56px;padding-right:0}
  .copy{display:flex;flex-direction:column;min-width:0}
  .brand img{display:block}
  h1{margin-top:auto;font:700 56px/1.06 var(--display);letter-spacing:-.035em;text-wrap:balance}
  h1.long{font-size:48px}
  h1.longer{font-size:42px}
  p{margin-top:20px;font-size:22px;line-height:1.45;color:var(--ink-2);max-width:30em}
  .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--ink);display:flex;gap:0;
    font:500 15px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  .foot span{padding:0 16px;border-left:1px solid var(--rule-2)}
  .foot span:first-child{padding-left:0;border-left:0;color:var(--ink)}
  .stage{position:relative}
  .phone{position:absolute;top:-8px;left:0;width:340px;border:1px solid var(--rule);border-radius:var(--r-4);
    overflow:hidden;background:var(--card);box-shadow:var(--lift)}
  .phone img{display:block;width:100%;height:auto}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="copy">
      <div class="brand"><img src="pocket-logo.svg" alt="Pocket" width="195" height="44"></div>
      <h1 id="t"></h1>
      <p id="d"></p>
      <div class="foot" id="f"></div>
    </div>
  </div>
  <script>
    // #t=<title>&d=<description>&f=<foot, "|" between cells>&img=<capture file in assets/>
    var q = new URLSearchParams(location.hash.slice(1)), t = q.get("t") || "", h = document.getElementById("t");
    h.textContent = t;
    if (t.length > 44) h.className = t.length > 64 ? "longer" : "long";
    document.getElementById("d").textContent = q.get("d") || "";
    (q.get("f") || "").split("|").forEach(function (s) {
      if (!s) return;
      var c = document.createElement("span"); c.textContent = s; document.getElementById("f").appendChild(c);
    });
    if (q.get("img")) {
      var card = document.getElementById("card"), st = document.createElement("div"), ph = document.createElement("div"),
          im = document.createElement("img");
      card.classList.add("pic"); st.className = "stage"; ph.className = "phone"; im.src = q.get("img"); im.alt = "";
      ph.appendChild(im); st.appendChild(ph); card.appendChild(st);
    }
  </script>
</body>
</html>
