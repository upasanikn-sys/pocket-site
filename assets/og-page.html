<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket — page card source</title>
<!--
  SOURCE FILE for assets/og/<page>.png (1200x630, each page's own link-preview card, SITE_TO_9 A14; redrawn 16 Oct 2026,
  STRIPE_LEVEL B6). A rendering target, not a page: tools/site_og.py opens it with the page's statement in the address's
  #fragment (t=, and d= for a page with no figure; fig= and cap= for a guide or a calculator, which are the engine's),
  the foot's cells (f=) and the working tree (tree=, the sample person's net worth as the app works it out), and
  saves what it draws. Regenerate with

    python tools/site_og.py

  Direction C: film ground, ink type, the Pocket logo as supplied, the working tree drawn in signal (it is the
  working), the drawing's dimension mark under the statement. No glow, grid, grain or shadow, and nothing from a
  third party.
-->
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="vestora-tokens.css?v=9">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans)}
  .card{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 408px;grid-template-rows:minmax(0,1fr) auto;column-gap:56px;padding:56px 72px 46px}
  .copy{display:flex;flex-direction:column;min-width:0;grid-column:1;grid-row:1}
  .brand img{display:block}
  h1{margin-top:auto;font:600 56px/1.06 var(--display);letter-spacing:-.035em;text-wrap:balance}
  h1.m{font-size:48px}
  h1.l{font-size:42px}
  h1.xl{font-size:36px}
  h1::after{content:"";display:block;width:96px;height:9px;margin-top:18px;border-inline:1px solid var(--ink-3);
    background:linear-gradient(var(--ink-3),var(--ink-3)) center/100% 1px no-repeat}
  p.d{margin-top:20px;font-size:22px;line-height:1.45;color:var(--ink-2);max-width:26em}
  .fig{margin-top:22px}
  .fig b{display:block;font:600 64px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums}
  .fig span{display:block;margin-top:10px;font-size:20px;line-height:1.4;color:var(--ink-2);max-width:25em}
  .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--ink);display:flex;gap:0;
    font:500 14px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden}
  .foot span{padding:0 14px;border-left:1px solid var(--rule-2)}
  .foot span:first-child{padding-left:0;border-left:0;color:var(--ink)}
  .card > .foot{grid-column:1/-1;grid-row:2;margin-top:22px}
  /* the strip is the card's brand band (DESIGN.md, the Brand-Surface Rule, 20 Oct 2026): the mark's navy, edge to edge, the
     light leaf on top; it names the address, the version and what never leaves, never a figure */
  .card{padding-bottom:0}
  .card > .foot{margin:22px -72px 0;padding:18px 72px 20px;background:var(--brand-ground);border-top:3px solid var(--brand);
    color:var(--on-brand-2)}
  .card > .foot span{border-left-color:var(--brand-leaf)}
  .card > .foot span:first-child{color:var(--on-brand)}
  .card > .foot span:last-child{color:var(--brand)}
  /* the working tree: the net worth, a stem in signal, and each part hanging from it on a leader */
  .tree{align-self:center;min-width:0;grid-column:2;grid-row:1}
  .tk{font:500 13px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  .tn{margin-top:8px;font:600 58px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums lining-nums}
  .tb{list-style:none;margin:10px 0 0 10px}
  .tb > li{position:relative;padding:0 0 16px 32px}
  .tb > li::before{content:"";position:absolute;left:0;top:-10px;bottom:0;border-left:1px solid var(--signal)}
  .tb > li:last-child::before{bottom:auto;height:24px}
  .tb > li::after{content:"";position:absolute;left:0;top:14px;width:24px;border-top:1px solid var(--signal)}
  .pl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font:600 21px/28px var(--display)}
  .pl i{font-style:normal;color:var(--ink-3);font-weight:600;margin-right:8px}
  .pl b{font:600 24px/28px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums}
  .ln{list-style:none;margin:4px 0 0 4px}
  .ln li{position:relative;padding-left:20px;display:flex;justify-content:space-between;gap:10px;
    font-size:15px;line-height:24px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .ln li::before{content:"";position:absolute;left:0;top:12px;width:12px;border-top:1px solid var(--signal)}
  .ln li::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--signal)}
  .ln li:last-child::after{bottom:auto;height:13px}
  .ln li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
  <div class="card">
    <div class="copy">
      <div class="brand"><img src="pocket-logo.svg" alt="Pocket" width="195" height="44"></div>
      <h1 id="t"></h1>
      <p class="d" id="d" hidden></p>
      <div class="fig" id="fig" hidden><b id="fb"></b><span id="fc"></span></div>
    </div>
    <div class="tree" id="tree" aria-hidden="true"></div>
    <div class="foot" id="f"></div>
  </div>
  <script>
    var q = new URLSearchParams(location.hash.slice(1)), t = q.get("t") || "", h = document.getElementById("t");
    h.textContent = t;
    var fig = q.get("fig"), n = t.length;
    h.className = fig ? (n > 54 ? "xl" : n > 40 ? "l" : "m") : (n > 64 ? "xl" : n > 50 ? "l" : n > 30 ? "m" : "");
    if (fig) {
      document.getElementById("fig").hidden = false;
      document.getElementById("fb").textContent = fig;
      var c = q.get("cap") || ""; document.getElementById("fc").textContent = c.charAt(0).toUpperCase() + c.slice(1);
    } else if (q.get("d")) {
      var d = document.getElementById("d"); d.hidden = false; d.textContent = q.get("d");
    }
    (q.get("f") || "").split("|").forEach(function (s) {
      if (!s) return;
      var c = document.createElement("span"); c.textContent = s; document.getElementById("f").appendChild(c);
    });
    var T = JSON.parse(q.get("tree") || "null");
    if (T) {
      var box = document.getElementById("tree");
      function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
      box.appendChild(el("div", "tk", "Net worth · sample person · " + T.asof));
      box.appendChild(el("div", "tn", T.nw));
      var ul = el("ul", "tb");
      T.parts.forEach(function (p) {
        var li = el("li"), row = el("div", "pl");
        var lab = el("span"); lab.appendChild(el("i", "", p.op)); lab.appendChild(document.createTextNode(p.label));
        row.appendChild(lab); row.appendChild(el("b", "", p.amt)); li.appendChild(row);
        var sub = el("ul", "ln");
        p.lines.forEach(function (l) { var s = el("li"); s.appendChild(el("span", "", l[0])); s.appendChild(el("span", "", l[1])); sub.appendChild(s); });
        li.appendChild(sub); ul.appendChild(li);
      });
      box.appendChild(ul);
    }
  </script>
</body>
</html>
